<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/decklet/*/TITLE*/</title>
<style>
:root{/*TOKENS*/--bg:#111315;--fg:#F3F4F6;--muted:#9CA3AF;--accent:#5B9CF6;--card:#1A1D21;--line:#2C3138;--sel:#5B9CF6;--box:#20262E/*/TOKENS*/;--W:960px;--H:540px;--Z:0.85;--AR:1.7778}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#canvas{position:relative;width:var(--W);height:var(--H);background:var(--card);border:1px solid var(--line);border-radius:12px;transform-origin:center;flex:none;overflow:hidden}
/* rows carry their own typography: the element adds NOTHING implicit (no padding, radius or pre-wrap) — chrome lives on .box/.tile only */
.el{position:absolute;cursor:grab;padding:0;border-radius:0;white-space:normal;line-height:normal}
.el.box{border:1.5px solid var(--accent);background:var(--box);text-align:center;padding:6px 8px;border-radius:8px;white-space:pre-wrap}
.el.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.el svg{display:block;width:100%;height:100%}
.el.rise{animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){.el.rise{animation:none}}
.el.selected{outline:2px solid var(--sel);outline-offset:2px}
.el[contenteditable="true"]{cursor:text;outline:2px dashed var(--sel);outline-offset:2px}
/* resize nib = selection chrome only: drawn by render() for one selected painting row; never in present/print */
.el .h{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:var(--accent);border:2px solid var(--bg);border-radius:4px;cursor:nwse-resize}
/* counter: inline inside the footer master element (inherits its font/baseline) — or the generic pin when no footer exists */
.num{pointer-events:none}
.el .num{white-space:nowrap}
.pin{position:absolute;bottom:10px;font:12px ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.08em}
/* inline marks change weight/style/position/colour — never size: sub/sup shift the baseline only */
.el sub,.el sup{font-size:inherit;line-height:0;vertical-align:sub}.el sup{vertical-align:super}
#hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
#hud button,#tb button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
#hud .sep{width:1px;height:18px;background:var(--line)}
#hud .spacer{flex:1}
/* "+" micro-menu: the add controls (Text / Box / Slide) nest under one button; opens upward, click-away closes */
#addwrap{position:relative}
#addmenu{display:none;position:absolute;left:0;bottom:calc(100% + 6px);flex-direction:column;gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:11;white-space:nowrap}
#addmenu.open{display:flex}
/* floating mini toolbar: role segment + inline marks + promote actions. No font pickers — roles ARE the type system */
#tb{position:fixed;z-index:12;display:flex;flex-wrap:wrap;max-width:calc(100vw - 8px);gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,Menlo,monospace}
#tb[hidden]{display:none}
#tb .seg{display:flex;gap:2px;padding-right:4px;border-right:1px solid var(--line)}
#tb .seg:last-of-type{border:0}
#tb button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#tb button:disabled{opacity:.35;cursor:default}
#tb .sw{width:16px;height:16px;padding:0;border-radius:50%;border:2px solid var(--line)}
#tb .sw.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
/* contact sheet: the slide manager — 3 across, rows scroll, live thumbnails */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:24px}
#sheet[hidden]{display:none}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cell{position:relative;aspect-ratio:var(--AR);border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:grab;background:var(--card);touch-action:none;user-select:none;transition:transform .15s ease}
.cell.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
/* pointer drag: the grabbed cell lifts (scale + shadow, tracks the pointer with no transition); siblings FLIP aside; drop eases in */
.cell.lift{z-index:3;transition:none;box-shadow:0 14px 36px rgba(0,0,0,.55);pointer-events:none;cursor:grabbing}
.cell.drop{z-index:3;transition:transform .16s ease}
@media (prefers-reduced-motion:reduce){.cell,.cell.drop{transition:none}}
.cell .cv{position:absolute;left:0;top:0;width:var(--W);height:var(--H);transform-origin:0 0;pointer-events:none}
.cell .cv .el{cursor:default}
.cell .n{position:absolute;left:8px;top:6px;z-index:1;font:12px ui-monospace,Menlo,monospace;color:var(--fg);background:rgba(0,0,0,.55);padding:1px 6px;border-radius:4px}
#print{display:none}
/* fullscreen = presentation mode: chrome hidden; body backdrop is set by render() to the CURRENT slide's bg */
body.present #hud,body.present #tb,body.present .h{display:none!important}
body.present #canvas{border:0;border-radius:0}
/* …but the HUD peeks back in while the pointer hovers the bottom twelfth (video-player controls pattern) */
body.present.peek #hud{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line)}
/* print: Safari forces US Letter PORTRAIT — it ignores px @page sizes AND the landscape keyword (margin:0 is honored).
   Layout is page-size-independent: each page is the model space at true size (absolute px, no clamps),
   `zoom`ed to the printable page width (816/W for Letter, 794/W for A4 — see deck.page). Each page paints ITS slide's bg; the dark body paints the letterbox. */
@page{size:letter;margin:0} /* deck.page==="a4" injects an overriding @page rule at load */
@media print{
  #wrap,#hud,#tb,#sheet{display:none!important}
  body{height:auto;overflow:visible;display:block;background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print{display:block}
  #print .pg{position:relative;width:var(--W);height:var(--H);zoom:var(--Z);background:var(--card);break-after:page;break-inside:avoid}
  #print .pg:last-child{break-after:auto}
  #print .cv{position:absolute;left:0;top:0;width:var(--W);height:var(--H)}
}
</style>
</head>
<body>
<div id="wrap"><div id="canvas"></div></div>
<div id="tb" hidden>
  <span class="seg" id="tb-roles"></span>
  <span class="seg" id="tb-inline">
    <button data-cmd="bold" title="Bold" aria-label="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic" aria-label="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline" aria-label="Underline"><u>U</u></button>
    <button data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
    <button data-cmd="subscript" title="Subscript" aria-label="Subscript">x<sub>2</sub></button>
    <button data-cmd="superscript" title="Superscript" aria-label="Superscript">x<sup>2</sup></button>
  </span>
  <span class="seg" id="tb-colors"></span>
  <button id="tb-layout" hidden title="Promote this geometry to the layout slot">Apply to layout</button>
  <button id="tb-master" hidden title="Promote this slide-local override back to every slide">Apply to all slides</button>
</div>
<div id="hud">
  <button id="prev" title="Previous slide (←)" aria-label="Previous slide">‹ prev</button>
  <button id="next" title="Next slide (→)" aria-label="Next slide">next ›</button>
  <div class="spacer"></div>
  <div id="addwrap">
    <button id="addbtn" aria-haspopup="true" aria-expanded="false" title="Add" aria-label="Add">+</button>
    <div id="addmenu" role="menu">
      <button id="add-text">+ Text</button>
      <button id="add-box">+ Box</button>
      <button id="sadd">+ Slide</button>
    </div>
  </div>
  <button id="grid-btn" title="Slides (G / Esc)" aria-label="Slides">⊞</button>
  <button id="pdf" title="Download PDF (⌘P prints)" aria-label="PDF">⤓</button>
  <div class="sep"></div>
  <button id="fs" title="Full screen (F)" aria-label="Full screen (F)">⛶</button>
</div>
<div id="sheet" hidden><div id="grid"></div></div>
<div id="print"></div>

const DECK=/*DECK*/{"title":"decklet — the self-explaining deck","w":960,"h":540,"styles":{"roles":{"Title":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":64,"weight":800,"lh":68,"ls":-1.5,"color":"var(--fg)"},"Supertitle":{"font":"ui-monospace,Menlo,Consolas,monospace","size":12,"weight":500,"lh":16,"ls":1.5,"color":"var(--accent)","tt":"uppercase"},"H1":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":34,"weight":800,"lh":40,"ls":-0.5,"color":"var(--fg)"},"H2":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":22,"weight":600,"lh":28,"ls":-0.3,"color":"var(--fg)"},"Body":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":16,"weight":400,"lh":24,"ls":0,"color":"var(--fg)"},"Caption":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":13,"weight":400,"lh":18,"ls":0,"color":"var(--muted)"},"Label":{"font":"ui-monospace,Menlo,Consolas,monospace","size":11,"weight":500,"lh":14,"ls":1,"color":"var(--muted)","tt":"uppercase"},"Stat":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":40,"weight":800,"lh":44,"ls":-1,"color":"var(--accent)"}},"margin":60,"pad":{"chip":"3px 8px","pill":"5px 12px"}},"layouts":{"title":{"supertitle":{"x":60,"y":132,"w":840,"role":"Supertitle"},"title":{"x":60,"y":158,"w":840,"role":"Title"}},"content":{"supertitle":{"x":60,"y":52,"w":840,"role":"Supertitle"},"title":{"x":60,"y":76,"w":840,"role":"H1"}}},"master":[{"id":"rule","x":60,"y":486,"h":1,"line":[900,486],"bg":"var(--line)"},{"id":"foot","footer":1,"x":660,"y":500,"w":240,"align":"right","role":"Label","text":"decklet"}],"slides":[{"name":"cover","layout":"title","els":[{"slot":"supertitle","text":"DECKLET · A SELF-EXPLAINING DECK"},{"slot":"title","text":"The renderer\nis the editor."},{"x":60,"y":318,"w":780,"role":"Body","color":"var(--muted)","text":"Agent-generated, brand-true, real-time editable presentations and assets — one portable HTML file, no office suite."},{"x":60,"y":410,"w":840,"role":"Caption","text":"Drag anything · double-click to retype · ⌘Z undoes · → next slide · Esc contact sheet · F present · ⤓ PDF"}]},{"name":"model","layout":"content","els":[{"slot":"supertitle","text":"THE MODEL"},{"slot":"title","text":"Every slide is rows in a JSON array."},{"x":60,"y":160,"w":140,"role":"Body","box":1,"text":"deck\n{w, h}"},{"x":240,"y":160,"w":140,"role":"Body","box":1,"text":"styles\n.roles"},{"x":420,"y":160,"w":140,"role":"Body","box":1,"text":"layouts\n.slots"},{"x":600,"y":160,"w":140,"role":"Body","box":1,"text":"master\n[…]"},{"x":780,"y":160,"w":140,"role":"Body","box":1,"text":"slides[]\n.els[]"},{"x":205,"y":176,"w":30,"role":"H2","color":"var(--accent)","text":"→"},{"x":385,"y":176,"w":30,"role":"H2","color":"var(--accent)","text":"→"},{"x":565,"y":176,"w":30,"role":"H2","color":"var(--accent)","text":"→"},{"x":745,"y":176,"w":30,"role":"H2","color":"var(--accent)","text":"→"},{"x":60,"y":270,"w":840,"role":"Body","text":"A row is {x, y, w, role, text}. Optional props turn the same row into a box, tile, bar, line, donut, svg or image. Nothing is implicit: the element adds no padding, radius or wrapping of its own — the role carries the type, the props carry the chrome."},{"x":60,"y":370,"w":840,"role":"Body","color":"var(--muted)","text":"Geometry is in model pixels on a fixed canvas (960×540 here). The editor scales the canvas to the window; print scales it to the page. Nothing reflows, so what you verify is what everyone sees."},{"x":60,"y":446,"w":840,"role":"Caption","text":"Check a model without a browser:  node bin/validate.mjs model.json"}]},{"name":"roles","layout":"content","els":[{"slot":"supertitle","text":"ROLES"},{"slot":"title","text":"Eight roles. One font and size per role."},{"x":60,"y":136,"w":560,"role":"Title","text":"Title 64"},{"x":60,"y":212,"w":560,"role":"Supertitle","text":"Supertitle · mono 12 · tracked · uppercase"},{"x":60,"y":234,"w":560,"role":"H1","text":"H1 · 34 / 40 · the content-slide title"},{"x":60,"y":278,"w":560,"role":"H2","text":"H2 · 22 / 28 · 600"},{"x":60,"y":310,"w":560,"role":"Body","text":"Body · 16 / 24 · 400 — the reading size"},{"x":60,"y":338,"w":560,"role":"Caption","text":"Caption · 13 / 18 · muted"},{"x":60,"y":360,"w":560,"role":"Label","text":"Label · mono 11 · tracked · uppercase"},{"x":660,"y":150,"w":240,"role":"Stat","align":"center","text":"1,024"},{"x":660,"y":202,"w":240,"role":"Label","align":"center","text":"Stat · 40 / 44 · 800"},{"x":660,"y":240,"w":240,"role":"Caption","text":"Title is the display size for cover and closing headlines only; H1 titles every content slide. No H3, no Subtitle."},{"x":60,"y":396,"w":840,"role":"Body","text":"A row never sets font, size, leading or tracking — the validator rejects it. Rows may carry weight, color, case and italics; inline runs carry bold, italic, underline, strike, sub/superscript and color. Retheme by editing the roles; every deck follows."}]},{"name":"layouts","layout":"content","els":[{"slot":"supertitle","text":"LAYOUTS & SLOTS"},{"slot":"title","text":"Geometry lives in the layout. Content lives in the slide."},{"x":60,"y":150,"w":840,"role":"Body","text":"This slide's supertitle and title are bound to slots — {slot:'title', text:'…'} with no x, y or w on the row. The layout named 'content' owns that geometry for every slide that uses it."},{"x":60,"y":240,"w":380,"role":"Caption","box":1,"text":"layouts.content.title\n{x:60, y:76, w:840, role:'H1'}"},{"x":455,"y":252,"w":50,"role":"H2","align":"center","color":"var(--accent)","text":"←"},{"x":520,"y":240,"w":380,"role":"Caption","box":1,"text":"slides[3].els[1]\n{slot:'title', text:'Geometry lives…'}"},{"x":60,"y":330,"w":840,"role":"Body","text":"Move a slotted row and the slide keeps a local override. The toolbar's “Apply to layout” promotes that geometry to the slot — every sibling slide follows."},{"x":60,"y":420,"w":840,"role":"Caption","tex ":"Body","text":"⊞ or Esc opens the contact sheet: live thumbnails, three across. Click, ⌘-click and shift-click select; double-click opens; grab a cell and drag — the others slide aside (mouse or touch); ⌫ deletes (never the last slide); ⌘C ⌘V ⌘D ⌘Z work as expected."},{"x":60,"y":246,"w":840,"role":"Body","text":"⤓ writes a true slide-sized PDF in the file itself — no library, no server: each slide is rasterised from its live DOM (foreignObject → canvas → JPEG) onto a W×H pt page, so 16:9 stays 16:9. ⌘P is the paper path: named Letter/A4 pages (Safari ignores pixel page sizes), the slide zoomed to the printable width."},{"x":60,"y":354,"w":840,"role":"Body","text":"F or ⛶ enters fullscreen presentation: chrome hides, the backdrop takes the current slide's background, the HUD peeks back at the bottom edge and stays pinned while a menu or the contact sheet is open."}]},{"name":"agents","layout":"content","els":[{"slot":"supertitle","text":"FOR AGENTS"},{"slot":"title","text":"validate → create → verify"},{"x":60,"y":150,"w":840,"role":"Supertitle","tt":"none","color":"var(--fg)","text":"node bin/validate.mjs model.json"},{"x":60,"y":176,"w":840,"role":"Supertitle","tt":"none","color":"var(--fg)","text":"node bin/create.mjs --model model.json --style style.json --out deck.html --format slides"},{"x":60,"y":202,"w":840,"role":"Supertitle","tt":"none","color":"var(--fg)","text":"node bin/verify.mjs deck.html --refs shots/"},{"x":60,"y":228,"w":840,"role":"Supertitle","tt":"none","color":"var(--fg)","text":"node bin/import-html.mjs --w 1600 --h 900 --out model.json 'pages/*.html'"},{"x":60,"y":282,"w":840,"role":"Body","text":"SKILL.md is the authoring contract: inputs (content, format, style), the process, the model and style contracts, anti-patterns and three worked examples. Layout-parity verification is mandatory; the AE pixel diff runs whenever reference shots exist."},{"x":60,"y":380,"w":840,"role":"Caption","text":"Formats: slides (16:9) is fully supported. carou // store shim: localStorage throws in sandboxed contexts (data:/locked-down file:) — degrade to no-persistence, never to a dead page

const dup=s=>JSON.parse(JSON.stringify(s));
function sheetKey(e){
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(e.key==='Escape'){sheetClose();return true}
  if(e.key==='Enter'&&gsel.size){i=[...gsel][0];sheetClose();return true}
  if((e.key==='Backspace'||e.key==='Delete')&&gsel.size){ // never the last slide
    const del=[...gsel].sort((a,b)=>b-a);if(del.length>=deck.slides.length)del.pop();if(!del.length)return true;
    snap();del.forEach(n=>deck.slides.splice(n,1));i=Math.min(del[del.length-1],deck.slides.length-1);gsel=new Set([i]);ganchor=i;save();sheetRender();return true}
  if(mod&&k==='c'&&gsel.size){clip=[...gsel].sort((a,b)=>a-b).map(n=>dup(deck.slides[n]));return true}
  if(mod&&k==='v'&&clip){snap();const at=Math.max(...gsel,-1)+1;deck.slides.splice(at,0,...clip.map(dup));gsel=new Set(clip.map((_,x)=>at+x));i=at;save();sheetRender();return true}
  if(mod&&k==='d'&&gsel.size){snap();const src=[...gsel].sort((a,b)=>a-b),at=src[src.length-1]+1;deck.slides.splice(at,0,...src.map(n=>dup(deck.slides[n])));gsel=new Set(src.map((_,x)=>at+x));i=at;save();sheetRender();return true}
  if(mod&&k==='z'){undo();gsel=new Set([Math.min(i,deck.slides.length-1)]);sheetRender();return true}
  return false;
}
addEventListener('keydown',e=>{
  if(e.target.isContentEditable){if(e.key==='Escape')e.target.blur();return}
  if(!sheet.hidden){if(sheetKey(e))e.preventDefault();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='Escape'){if(sel.size){sel.clear();render()}else sheetOpen();return}
  if(e.key==='ArrowRight'||e.key===' ')nav(1);
  if(e.key==='ArrowLeft')nav(-1);
  if((e.key==='Backspace'||e.key==='Delete')&&sel.size){
    snap();[...sel].filter(k=>typeof k!=='number').forEach(k=>(slide().hide=slide().hide||[]).push(k.slice(2)));
    [...sel].filter(k=>typeof k==='number').sort((a,b)=>b-a).forEach(n=>slide().els.splice(n,1));sel.clear();save();render();
  }
  if(e.key.toLowerCase()==='f')fs();
  if(e.key.toLowerCase()==='g')sheetOpen();
});
// native Fullscreen API — F or button toggles; fullscreen IS presentation mode (chrome hidden, slide fills the screen)
const fs=()=>{commitEdit();return document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('present',!!document.fullscreenElement);document.body.classList.remove('peek');sel.clear();sheet.hidden=true;render();fit()});
// present mode: HUD reappears while the pointer hovers the bottom twelfth of the screen, hides on leaving —
// but never auto-hides while something it opened is still open (the + menu, the text toolbar, the contact sheet)
const pinned=()=>addmenu.classList.contains('open')||!tb.hidden||!sheet.hidden;
addEventListener('mousemove',e=>{if(present())document.body.classList.toggle('peek',e.clientY>innerHeight*11/12||pinned())});
$('fs').onclick=fs;
// ⤓ PDF: a TRUE slide-sized PDF written in-file, zero dependencies. Each slide is rasterised from its live DOM in LAYERS:
// (a) the deck's <style> + the slide's XHTML inside an SVG foreignObject → <img> → canvas at 2×, with every img/svg row
// kept as an invisible placeholder (layout intact, pixels deferred); (b) every img row drawn straight onto the canvas from a
// decoded Image (await decode()), every inline svg row serialised ALONE into its own Image and drawn at the row's rect — in
// model z-order. Why: WebKit fires the foreignObject image's onload before the nested <img> it contains have decoded (data:
// PNGs above ~20KB came out blank in Safari's export — the headshot, the larger glyphs), so nothing nested is trusted to paint.
// Then JPEG → one DCTDecode XObject drawn full-page on a W×H pt page (1 model px = 1 pt: 1600×900 / 960×540 — real 16:9, no
// letterboxing). Fonts: awaits document.fonts.ready (the deck makes no requests anyway). Falls back to print() — the paper
// path, ⌘P — if rasterisation throws or the canvas is tainted. The xref table is byte-exact.
async function exportPdf(){
  commitEdit();await document.fonts.ready;const css=document.querySelector('style').textContent,S=2,jpg=[];
  const load=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});
  for(const [n,s] of deck.slides.entries()){
    const cv=document.createElement('div');cv.style.cssText=`position:absolute;left:-99999px;top:0;width:${W}px;height:${H}px;overflow:hidden;font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;color:${getComputedStyle(canvas).color}`;drawEls(s,cv,false);num(cv,n+1);
    document.body.appendChild(cv); // in-document so the media rows have geometry (slots resolve to real rects here)
    const cb=cv.getBoundingClientRect(),media=[...cv.querySelectorAll('.el')].filter(d=>d.querySelector('img,svg')).map(d=>{
      const e=d.querySelector('img,svg'),b=e.getBoundingClientRect(),cs=getComputedStyle(d);
      return{el:d,x:b.left-cb.left,y:b.top-cb.top,w:b.width,h:b.height,op:+cs.opacity,radius:parseFloat(cs.borderRadius)||0,color:cs.color,src:e.tagName==='IMG'?e.getAttribute('src'):null,svg:e.tagName==='IMG'?null:e,fit:e.tagName==='IMG'?e.style.objectFit:null,pos:e.tagName==='IMG'?e.style.objectPosition:null};
    });
    media.forEach(m=>m.el.style.visibility='hidden');cv.style.position='relative';cv.style.left='0'; // placeholders: layout stays, pixels come from layer (b); back on-canvas for the serialisation
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><style>${css}</style><foreignObject width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="--W:${W}px;--H:${H}px">${new XMLSerializer().serializeToString(cv)}</div></foreignObject></svg>`;
    cv.remove();
    const im=await load('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)); // data: URL, not blob: — a blob minted by a file:// page is cross-origin to itself and taints the canvas
    const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const g=c.getContext('2d');
    canvas.style.background=s.bg||'';g.fillStyle=getComputedStyle(canvas).backgroundColor;canvas.style.background='';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    for(const m of media){ // layer (b): media rows, DOM order == model z-order
      let pic;
      if(m.src){pic=new Image();pic.src=m.src;await pic.decode()}
      else{const x=m.svg.cloneNode(true);x.setAttribute('xmlns','http://www.w3.org/2000/svg');x.setAttribute('width',m.w);x.setAttribute('height',m.h);x.style.color=m.color;if(!x.getAttribute('viewBox')&&x.getAttribute('width'))x.setAttribute('preserveAspectRatio','none');
        pic=await load('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(x)))}
      g.save();g.globalAlpha=m.op;g.beginPath();if(m.radius&&g.roundRect)g.roundRect(m.x*S,m.y*S,m.w*S,m.h*S,m.radius*S);else g.rect(m.x*S,m.y*S,m.w*S,m.h*S);g.clip();
      // object-fit: fill (default) stretches; cover/contain scale by the ratio and place by object-position (defaults 50% 50%)
      let dx=m.x,dy=m.y,dw=m.w,dh=m.h;
      if(m.src&&(m.fit==='cover'||m.fit==='contain')){const k=m.fit==='cover'?Math.max(m.w/pic.naturalWidth,m.h/pic.naturalHeight):Math.min(m.w/pic.naturalWidth,m.h/pic.naturalHeight);dw=pic.naturalWidth*k;dh=pic.naturalHeight*k;
        const p=(m.pos||'50% 50%').split(/\s+/).map(v=>parseFloat(v)/100);dx=m.x+(m.w-dw)*(isNaN(p[0])?.5:p[0]);dy=m.y+(m.h-dh)*(isNaN(p[1])?.5:p[1])}
      g.drawImage(pic,dx*S,dy*S,dw*S,dh*S);g.restore();
    }
    jpg.push(atob(c.toDataURL('image/jpeg',.92).split(',')[1])); // SecurityError here = tainted canvas → caller falls back to print()
  }
  // minimal PDF: 1 catalog · 2 pages · per slide {page, image XObject, content}; offsets tracked as bytes (latin-1 strings)
  const obj=[],off=[];let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const add=body=>{obj.push(body);return obj.length};
  add('<< /Type /Catalog /Pages 2 0 R >>');const pagesId=add('');const kids=[];
  jpg.forEach((j,n)=>{const p=add('');kids.push(p+' 0 R');const im=add(`<< /Type /XObject /Subtype /Image /Width ${W*S} /Height ${H*S} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n${j}\nendstream`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im Do Q`,ct=add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    obj[p-1]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im ${im} 0 R >> >> /Contents ${ct} 0 R >>`});
  obj[pagesId-1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
  obj.forEach((b,n)=>{off.push(out.length);out+=`${n+1} 0 obj\n${b}\nendobj\n`});
  const x=out.length;out+=`xref\n0 ${obj.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${obj.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Uint8Array.from(out,ch=>ch.charCodeAt(0))],{type:'application/pdf'}));a.download=document.title.replace(/[\/:*?"<>|]+/g,'-')+'.pdf';a.click();
}
$('pdf').onclick=()=>exportPdf().catch(()=>print());
$('grid-btn').onclick=()=>sheet.hidden?sheetOpen():sheetClose();
// "+" micro-menu: one HUD button fans out Text / Box / Slide; any pick or a click anywhere outside closes it
const addmenu=$('addmenu'),addbtn=$('addbtn');
const menu=open=>{addmenu.classList.toggle('open',open);addbtn.setAttribute('aria-expanded',open)};
addbtn.onclick=()=>menu(!addmenu.classList.contains('open'));
document.addEventListener('mousedown',e=>{if(!e.target.closest('#addwrap'))menu(false)});
// add text + box: new text is born Body — or binds to a free slot of the slide's layout (inheriting its role + geometry)
const TPL={
  text:{x:Math.round(W*.4),y:Math.round(H*.46),w:Math.round(W*.31),role:'Body',text:'New text — double-click to edit'},
  box:{x:Math.round(W*.42),y:Math.round(H*.43),w:Math.round(W*.19),role:'Body',box:1,text:'box'}
};
for(const k in TPL)$('add-'+k).onclick=()=>{
  commitEdit();menu(false);snap();const s=slide(),el=structuredClone(TPL[k]);
  if(k==='text'){const free=Object.keys(LAY(s)).find(n=>!s.els.some(e=>e.slot===n));if(free){['x','y','w','role'].forEach(p=>delete el[p]);el.slot=free}}
  s.els.push(el);sel.clear();sel.add(s.els.length-1);save();render();
};
// navigation (‹ prev / next › + arrow keys)
const nav=d=>{commitEdit();sel.clear();i+=d;render()};
$('prev').onclick=()=>nav(-1);
$('next').onclick=()=>nav(1);
// + Slide: same layout as the current slide, title slot filled; deleting/reordering lives in the contact sheet
$('sadd').onclick=()=>{commitEdit();menu(false);snap();const s=slide(),ns={els:[]};if(s.bg)ns.bg=s.bg;if(s.layout){ns.layout=s.layout;const t=Object.entries(LAY(s)).find(([,v])=>v.role==='H1');ns.els.push(t?{slot:t[0],text:'New slide'}:{x:60,y:88,w:W-120,role:'H1',text:'New slide'})}else ns.els.push({x:60,y:88,w:W-120,role:'H1',text:'New slide'});deck.slides.splice(i+1,0,ns);i++;sel.clear();save();render()};
fit();render();

// self-check — model round-trips through JSON and renderer draws every element (+ master rows + counter)
console.assert(JSON.parse(JSON.stringify(DECK)).slides.length===DECK.slides.length,'model round-trip');
console.assert(canvas.querySelectorAll('.el').length===DECK.slides[0].els.length+(DECK.master||[]).length,'renderer draws all elements');
</script>
</body>
</html>
