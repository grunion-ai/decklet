<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/decklet/*/TITLE*/</title>
<style>
:root{/*TOKENS*/--bg:#111315;--fg:#F3F4F6;--muted:#9CA3AF;--accent:#5B9CF6;--card:#1A1D21;--line:#2C3138;--sel:#5B9CF6;--box:#20262E/*/TOKENS*/;--W:960px;--H:540px;--Z:0.85;--AR:1.7778}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#canvas{position:relative;width:var(--W);height:var(--H);background:var(--card);border:1px solid var(--line);border-radius:12px;transform-origin:center;flex:none;overflow:hidden}
/* rows carry their own typography: the element adds NOTHING implicit (no padding, radius or pre-wrap) — chrome lives on .box/.tile only */
.el{position:absolute;cursor:grab;padding:0;border-radius:0;white-space:normal;line-height:normal}
.el.box{border:1.5px solid var(--accent);background:var(--box);text-align:center;padding:6px 8px;border-radius:8px;white-space:pre-wrap}
.el.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.el svg{display:block;width:100%;height:100%}
.el.rise{animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){.el.rise{animation:none}}
.el.selected{outline:2px solid var(--sel);outline-offset:2px}
.el[contenteditable="true"]{cursor:text;outline:2px dashed var(--sel);outline-offset:2px}
/* resize nib = selection chrome only: drawn by render() for one selected painting row; never in present/print */
.el .h{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:var(--accent);border:2px solid var(--bg);border-radius:4px;cursor:nwse-resize}
/* counter: inline inside the footer master element (inherits its font/baseline) — or the generic pin when no footer exists */
.num{pointer-events:none}
.el .num{white-space:nowrap}
.pin{position:absolute;right:14px;bottom:10px;font:12px ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.08em}
#hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
#hud button,#tb button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
#hud .sep{width:1px;height:18px;background:var(--line)}
#hud .spacer{flex:1}
/* "+" micro-menu: the add controls (Text / Box / Slide) nest under one button; opens upward, click-away closes */
#addwrap{position:relative}
#addmenu{display:none;position:absolute;left:0;bottom:calc(100% + 6px);flex-direction:column;gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:11;white-space:nowrap}
#addmenu.open{display:flex}
/* floating mini toolbar: role segment + inline marks + promote actions. No font pickers — roles ARE the type system */
#tb{position:fixed;z-index:12;display:flex;flex-wrap:wrap;max-width:calc(100vw - 8px);gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,Menlo,monospace}
#tb[hidden]{display:none}
#tb .seg{display:flex;gap:2px;padding-right:4px;border-right:1px solid var(--line)}
#tb .seg:last-of-type{border:0}
#tb button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#tb button:disabled{opacity:.35;cursor:default}
#tb .sw{width:16px;height:16px;padding:0;border-radius:50%;border:2px solid var(--line)}
#tb .sw.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
/* contact sheet: the slide manager — 3 across, rows scroll, live thumbnails */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:24px}
#sheet[hidden]{display:none}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cell{position:relative;aspect-ratio:var(--AR);border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--card)}
.cell.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.cell .cv{position:absolute;left:0;top:0;width:var(--W);height:var(--H);transform-origin:0 0;pointer-events:none}
.cell .cv .el{cursor:default}
.cell .n{position:absolute;left:8px;top:6px;z-index:1;font:12px ui-monospace,Menlo,monospace;color:var(--fg);background:rgba(0,0,0,.55);padding:1px 6px;border-radius:4px}
.cell.ins-before::before,.cell.ins-after::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--accent);z-index:2}
.cell.ins-before::before{left:-12px}.cell.ins-after::after{right:-12px}
#print{display:none}
/* fullscreen = presentation mode: chrome hidden; body backdrop is set by render() to the CURRENT slide's bg */
body.present #hud,body.present #tb,body.present #sheet,body.present .h{display:none!important}
body.present #canvas{border:0;border-radius:0}
/* …but the HUD peeks back in while the pointer hovers the bottom twelfth (video-player controls pattern) */
body.present.peek #hud{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line)}
/* print: Safari forces US Letter PORTRAIT — it ignores px @page sizes AND the landscape keyword (margin:0 is honored).
   Layout is page-size-independent: each page is the model space at true size (absolute px, no clamps),
   `zoom`ed to the printable page width (816/W for Letter, 794/W for A4 — see deck.page). Each page paints ITS slide's bg; the dark body paints the letterbox. */
@page{size:letter;margin:0} /* deck.page==="a4" injects an overriding @page rule at load */
@media print{
  #wrap,#hud,#tb,#sheet{display:none!important}
  body{height:auto;overflow:visible;display:block;background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print{display:block}
  #print .pg{position:relative;width:var(--W);height:var(--H);zoom:var(--Z);background:var(--card);break-after:page;break-inside:avoid}
  #print .pg:last-child{break-after:auto}
  #print .cv{position:absolute;left:0;top:0;width:var(--W);height:var(--H)}
}
</style>
</head>
<body>
<div id="wrap"><div id="canvas"></div></div>
<div id="tb" hidden>
  <span class="seg" id="tb-roles"></span>
  <span class="seg" id="tb-inline">
    <button data-cmd="bold" title="Bold" aria-label="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic" aria-label="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline" aria-label="Underline"><u>U</u></button>
    <button data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
  </span>
  <span class="seg" id="tb-colors"></span>
  <button id="tb-layout" hidden title="Promote this geometry to the layout slot">Apply to layout</button>
  <button id="tb-master" hidden title="Promote this slide-local override back to every slide">Apply to all slides</button>
</div>
<div id="hud">
  <button id="prev" title="Previous slide (←)" aria-label="Previous slide">‹ prev</button>
  <button id="next" title="Next slide (→)" aria-label="Next slide">next ›</button>
  <div class="spacer"></div>
  <div id="addwrap">
    <button id="addbtn" aria-haspopup="true" aria-expanded="false" title="Add" aria-label="Add">+</button>
    <div id="addmenu" role="menu">
      <button id="add-text">+ Text</button>
      <button id="add-box">+ Box</button>
      <button id="sadd">+ Slide</button>
    </div>
  </div>
  <button id="grid-btn" title="Slides (G / Esc)" aria-label="Slides">⊞</button>
  <button id="pdf" title="PDF (print)" aria-label="PDF">⤓</button>
  <div class="sep"></div>
  <button id="fs" title="Full screen (F)" aria-label="Full screen (F)">⛶</button>
</div>
<div id="sheet" hidden><div id="grid"></div></div>
<div id="print"></div>

<script>
// ONE element type; box/tile/bar(h+bg)/line/donut/align/radius/anim/svg/img/html are optional props on it.
// Deck = {w,h, format?, page?, styles:{roles,pad}, slots?:{…}, layouts:{name:{slot:{x,y,w,h?,role}}}, master:[…], slides:[{layout?,bg?,hide?,els}]}
// Full contract: SKILL.md (MODEL CONTRACT) · validator: bin/validate.mjs
//  · role      → complete text treatment from styles.roles; raw font props on a row are overrides only
//  · slot      → row inherits the layout slot's geometry+role; its own x/y/w/h are slide-local overrides
//  · master    → drawn under every slide; a slide edit forks a row with override:<id>; hide:[id] suppresses one
//  · footer    → master flag: the page counter renders inline inside this row (same font/baseline/edge padding)
//  · nowrap / w:'auto' / p → text-fit intent: single line, shrink-to-fit, explicit padding (or a styles.pad token)
// img (data-URI) and css (raw escape hatch) are supported but discouraged — the validator warns on css.
const DECK=/*DECK*/{"w":960,"h":540,"styles":{"roles":{"Supertitle":{"font":"ui-monospace,Menlo,Consolas,monospace","size":12,"weight":500,"lh":16,"ls":1.5,"color":"var(--accent)","tt":"uppercase"},"H1":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":34,"weight":800,"lh":40,"ls":-0.5,"color":"var(--fg)"},"H2":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":22,"weight":600,"lh":28,"ls":-0.3,"color":"var(--fg)"},"Body":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":16,"weight":400,"lh":24,"ls":0,"color":"var(--fg)"},"Caption":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":13,"weight":400,"lh":18,"ls":0,"color":"var(--muted)"},"Label":{"font":"ui-monospace,Menlo,Consolas,monospace","size":11,"weight":500,"lh":14,"ls":1,"color":"var(--muted)","tt":"uppercase"},"Stat":{"font":"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif","size":40,"weight":800,"lh":44,"ls":-1,"color":"var(--accent)"}},"pad":{"chip":"3px 8px","pill":"5px 12px"}},"layouts":{},"master":[],"slides":[{"els":[]}]}/*/DECK*/;

// store shim: localStorage throws in sandboxed contexts (data:/locked-down file:) — degrade to no-persistence, never to a dead page
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
// storage namespace is per deck (create.mjs stamps it from the model hash) — two decks on one origin never share edits
const NS=/*KEY*/'decklet:template'/*/KEY*/,KEY=NS+':model',HKEY=NS+':hist',canvas=document.getElementById('canvas'),$=id=>document.getElementById(id);
let deck=JSON.parse(store.get(KEY)||'null')||structuredClone(DECK),i=0,sel=new Set();
const W=deck.w||960,H=deck.h||540;
const PAGE=deck.page==='a4'?'a4':'letter',PW=PAGE==='a4'?794:816;
document.documentElement.style.cssText=`--W:${W}px;--H:${H}px;--Z:${(PW/W).toFixed(4)};--AR:${(W/H).toFixed(4)}`;
if(PAGE==='a4'){const st=document.createElement('style');st.textContent='@page{size:a4;margin:0}';document.head.appendChild(st)}
// undo = snapshot stack; snap() BEFORE each mutation; persisted so ⌘Z survives refresh. no redo yet
let history=JSON.parse(store.get(HKEY)||'[]');
const hsave=()=>store.set(HKEY,JSON.stringify(history));
const snap=()=>{history.push(JSON.stringify(deck));if(history.length>50)history.shift();hsave()};
function undo(){if(!history.length)return;deck=JSON.parse(history.pop());hsave();sel.clear();save();render()}

// windowed = maximal slide: scale up as well as down (no 1-cap); reserve only real chrome (few px sides, HUD below)
function fit(){const s=document.fullscreenElement?Math.min(innerWidth/W,innerHeight/H):Math.min((innerWidth-12)/W,(innerHeight-52)/H);canvas.style.transform=`scale(${s})`;placeTb()}
addEventListener('resize',fit);

function save(){store.set(KEY,JSON.stringify(deck))}
const slide=()=>deck.slides[i];
const LAY=s=>({...(deck.slots||{}),...((deck.layouts||{})[s.layout]||{})});
// res(): slot geometry+role ← role treatment ← the row's own props (overrides). Every consumer reads through this.
const res=(el,s)=>{const sl=el.slot&&LAY(s)[el.slot]||{};const r=el.role||sl.role;return {...sl,...(r&&deck.styles&&deck.styles.roles[r]||{}),...el}};
const paints=r=>!!(r.text||r.html||r.svg||r.img||r.bg||r.bd||r.bt||r.br||r.bb||r.bl||r.box||r.tile||r.line||r.donut!=null);
// shared element painter — render(), the contact sheet and the print pipeline all use it
function drawEls(s,root,animate){
  let a=0;
  root.style.background=s.bg||'var(--card)';
  const items=[];
  (deck.master||[]).forEach(m=>{if((s.hide||[]).includes(m.id)||(s.els||[]).some(e=>e.override===m.id))return;items.push({el:m,m:m.id})});
  (s.els||[]).forEach((el,n)=>items.push({el,n}));
  items.forEach(({el,n,m})=>{
    const r=res(el,s),d=document.createElement('div');
    d.className='el'+(r.box?' box':'')+(r.tile?' tile':'')+(r.anim&&animate?' '+r.anim:'');
    if(r.svg)d.innerHTML=r.svg;
    else if(r.img){const im=new Image();im.src=r.img;im.style.cssText=`display:block;width:100%;height:100%;object-fit:${r.fit||'fill'};object-position:${r.pos||'50% 50%'};pointer-events:none`;d.appendChild(im)}
    else if(r.html)d.innerHTML=r.html; // rich inline runs (<b>/<i>/<u>/<s>/<span>) — trusted model content
    else d.textContent=r.text||'';
    const pad=r.p!=null?(deck.styles&&deck.styles.pad&&deck.styles.pad[r.p])||(typeof r.p==='number'?r.p+'px':r.p):null;
    d.style.cssText=`left:${r.x||0}px;top:${r.y||0}px;width:${r.w==='auto'?'auto':(r.w||0)+'px'};font-size:${r.size||14}px;`+
      (r.weight?`font-weight:${r.weight};`:'')+(r.color?`color:${r.color};`:'')+
      (r.font?`font-family:${r.font};`:'')+(r.mono?'font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;':'')+
      (r.ls!=null?`letter-spacing:${r.ls}px;`:'')+(r.lh!=null?`line-height:${r.lh}px;`:'')+(r.tt?`text-transform:${r.tt};`:'')+
      (r.ws?`white-space:${r.ws};`:'')+(r.nowrap?'white-space:nowrap;':'')+(!r.html&&/\n/.test(r.text||'')?'white-space:pre-wrap;':'')+(r.italic?'font-style:italic;':'')+(r.op!=null?`opacity:${r.op};`:'')+
      (pad?`padding:${pad};`:'')+(r.h?`height:${r.h}px;`:'')+(r.bg?`background:${r.bg};`:'')+
      (r.bd?`border:${r.bd};`:'')+(r.bt?`border-top:${r.bt};`:'')+(r.br?`border-right:${r.br};`:'')+(r.bb?`border-bottom:${r.bb};`:'')+(r.bl?`border-left:${r.bl};`:'')+
      (r.shadow?`box-shadow:${r.shadow};`:'')+(r.bar?'border-radius:6px 6px 0 0;':'')+
      (r.align?`text-align:${r.align};`:'')+(r.radius!=null?`border-radius:${typeof r.radius==='number'?r.radius+'px':r.radius};`:'')+(r.img||r.svg?'overflow:hidden;':'')+(r.css?r.css+';':'');
    // footer master: the counter is appended INSIDE this row, so anchor it to its nearer edge and let it grow away from it
    if(r.footer){d.dataset.footer='1';d.style.whiteSpace='nowrap';if((r.x||0)+(r.w||0)/2>W/2){d.style.left='auto';d.style.right=(W-(r.x||0)-(r.w||0))+'px';d.style.width='auto'}}
    // line = one rotated div (no SVG layer); donut = one conic-gradient ring with a mask hole
    if(r.line){const dx=r.line[0]-r.x,dy=r.line[1]-r.y;
      d.style.cssText+=`width:${Math.hypot(dx,dy).toFixed(1)}px;height:${r.h||3}px;padding:0;background:${r.bg||'var(--accent)'};transform:rotate(${Math.atan2(dy,dx)}rad);transform-origin:0 50%;border-radius:2px;`}
    if(r.donut!=null)d.style.cssText+=`width:${r.w}px;height:${r.w}px;padding:0;border-radius:50%;background:conic-gradient(${r.color||'var(--accent)'} ${r.donut}%,var(--line) 0);-webkit-mask:radial-gradient(#0000 55%,#000 56%);mask:radial-gradient(#0000 55%,#000 56%);`;
    if(r.anim&&animate)d.style.animationDelay=(a++*120)+'ms';
    if(el._lines)d.dataset.lines=el._lines; // extractor metadata: source line count (layout-parity proof)
    if(n!=null)d.dataset.n=n;else d.dataset.m=m;
    root.appendChild(d);
  });
}
let lastAnim=-1; // anim replays on slide ENTRY only — drag/select re-renders of the same slide must not restagger
const present=()=>document.body.classList.contains('present');
function render(){
  i=Math.max(0,Math.min(deck.slides.length-1,i));
  const s=slide(),animate=i!==lastAnim;lastAnim=i;
  sel.forEach(k=>{if(typeof k==='number'?!s.els[k]:!(deck.master||[]).some(m=>m.id===k.slice(2)))sel.delete(k)}); // stale keys (slide changed under a selection) never reach the painter
  canvas.innerHTML='';
  drawEls(s,canvas,animate);
  const node=k=>canvas.querySelector(typeof k==='number'?`[data-n="${k}"]`:`[data-m="${k.slice(2)}"]`);
  sel.forEach(k=>{const d=node(k);d&&d.classList.add('selected')});
  // nib: one selected row that paints and has size; never in present mode (print never calls render)
  if(sel.size===1&&!present()){const k=[...sel][0],d=node(k);const r=d&&res(typeof k==='number'?s.els[k]:deck.master.find(m=>m.id===k.slice(2)),s);
    if(d&&paints(r)&&r.w!==0&&r.h!==0){const h=document.createElement('i');h.className='h';d.appendChild(h)}}
  num(canvas,i+1);
  document.body.style.background=present()?(s.bg||'var(--card)'):''; // present backdrop = CURRENT slide's bg
  if(!$('sheet').hidden)sheetRender();
  placeTb();
}
// counter: inside the footer master row when one exists (inherits its font/baseline/padding); else the generic pin
const num=(root,n)=>{const f=root.querySelector('[data-footer]');const c=document.createElement(f?'span':'div');c.className=f?'num':'num pin';c.textContent=(f?' · ':'')+n+' / '+deck.slides.length;(f||root).appendChild(c)};
// print: every slide becomes one page painted with its own bg — same drawEls, no handlers needed
addEventListener('beforeprint',()=>{commitEdit();const p=$('print');p.innerHTML='';deck.slides.forEach((s,n)=>{const pg=document.createElement('div');pg.className='pg';pg.style.background=s.bg||'var(--card)';const cv=document.createElement('div');cv.className='cv';drawEls(s,cv,false);num(cv,n+1);pg.appendChild(cv);p.appendChild(pg)})});
addEventListener('afterprint',()=>{$('print').innerHTML=''});

// master fork: the first edit of a master row on a slide copies it into the slide as override:<id> — identical everywhere until then
function fork(id){const m=deck.master.find(m=>m.id===id);const o=structuredClone(m);delete o.id;o.override=id;slide().els.push(o);return slide().els.length-1}
const selEl=()=>{if(sel.size!==1)return null;const k=[...sel][0];return typeof k==='number'?slide().els[k]:null};
// drag + resize + select + edit — listener sits on #wrap so click-off ANYWHERE outside an element
// (canvas gaps AND the margin around the canvas) deselects; the HUD is outside #wrap
let drag=null;
$('wrap').addEventListener('mousedown',e=>{
  if(!e.target.closest('[contenteditable="true"]'))commitEdit(); // flush a live text edit BEFORE any deselect/re-render destroys its node
  const scale=canvas.getBoundingClientRect().width/W;
  if(e.target.className==='h'){ // SE handle: drag changes w (and h when the element has one)
    let k=[...sel][0];snap();if(typeof k!=='number'){k=fork(k.slice(2));sel.clear();sel.add(k)}
    const el=slide().els[k],r=res(el,slide());
    drag={mode:'size',el,ow:r.w==='auto'?100:(r.w||100),oh:r.h,sx:e.clientX/scale,sy:e.clientY/scale,moved:true};
    e.preventDefault();return;
  }
  const t=e.target.closest('.el');
  if(!t){if(sel.size){sel.clear();render()}return} // click-off = deselect (nib goes with it)
  if(t.isContentEditable)return;
  const k=t.dataset.n!=null?+t.dataset.n:'m:'+t.dataset.m;
  if(e.metaKey||e.ctrlKey){sel.has(k)?sel.delete(k):sel.add(k)}
  else if(!sel.has(k)){sel.clear();sel.add(k)}
  // double-click handled via e.detail — the selection re-render on click 1 destroys the
  // node, so a real dblclick event never fires on it (this was the "can't edit" bug)
  if(e.detail>=2){edit(k);return}
  drag={mode:'move',items:[...sel].map(m=>{const el=typeof m==='number'?slide().els[m]:deck.master.find(x=>x.id===m.slice(2));const r=res(el,slide());return {k:m,el,ox:r.x||0,oy:r.y||0}}),
        sx:e.clientX/scale,sy:e.clientY/scale,moved:false};
  render();
});
addEventListener('mousemove',e=>{
  if(!drag)return;
  const scale=canvas.getBoundingClientRect().width/W;
  const dx=e.clientX/scale-drag.sx,dy=e.clientY/scale-drag.sy;
  if(drag.mode==='size'){
    drag.el.w=Math.max(20,Math.round(drag.ow+dx));
    if(drag.oh!=null)drag.el.h=Math.max(10,Math.round(drag.oh+dy));
    render();return;
  }
  if(!drag.moved){snap();drag.moved=true;drag.items.forEach(it=>{if(typeof it.k!=='number'){const n=fork(it.k.slice(2));sel.delete(it.k);sel.add(n);it.el=slide().els[n]}})}
  drag.items.forEach(it=>{it.el.x=Math.round(it.ox+dx);it.el.y=Math.round(it.oy+dy)});
  render();
});
addEventListener('mouseup',()=>{if(drag){drag=null;save()}});
// commitEdit: the ONE place a live text edit lands in the model. Called first on every path that re-renders or
// destroys nodes (click-off, nav, slide add/delete, add element, fullscreen, print) — a blur handler alone is too late:
// render() wipes the contenteditable node before blur fires, and the typed text died with it. edit() snaps first, so ⌘Z restores.
function commitEdit(){
  const t=canvas.querySelector('.el[contenteditable="true"]');
  if(!t)return;
  const el=slide().els[+t.dataset.n];
  t.onblur=null;t.querySelectorAll('.h,.num').forEach(x=>x.remove());
  if(t.querySelector('*')){el.html=t.innerHTML;delete el.text}else{el.text=t.textContent;delete el.html} // inline marks → html; plain → text
  t.contentEditable=false;save();render();
}
function edit(k){
  if(typeof k!=='number'){snap();k=fork(k.slice(2));sel.clear();sel.add(k);render()}else snap();
  const el=slide().els[k];if(el.svg||el.img)return; // marks and images have no text to edit
  drag=null;const t=canvas.querySelector(`[data-n="${k}"]`);t.querySelectorAll('.h,.num').forEach(x=>x.remove());t.contentEditable=true;t.focus(); // nib + counter are chrome, not content
  getSelection().selectAllChildren(t);
  t.onblur=commitEdit;placeTb();
}
// ── floating mini toolbar (roles + inline marks + promote actions) ──
const tb=$('tb');
// color swatches = the text colors ALREADY in the deck (roles first, then first appearance in rows/runs). No picker, no hex input.
// dedupe on the RESOLVED value (#23262C and rgb(35, 38, 44) are one swatch); the first literal spelling is kept
const deckColors=()=>{const seen=new Map();for(const c of [...Object.values(deck.styles&&deck.styles.roles||{}).map(r=>r.color),...[...(deck.master||[]),...deck.slides.flatMap(s=>s.els||[])].flatMap(e=>[e.color,...[...(e.html||'').matchAll(/color:\s*([^;"']+)/g)].map(m=>m[1].trim())])].filter(Boolean)){canvas.style.color=c;const k=getComputedStyle(canvas).color;if(!seen.has(k))seen.set(k,c)}canvas.style.color='';return [...seen.values()]};
const runSpan=(sr,node)=>{const a=sr.rangeCount&&sr.anchorNode,el=a&&(a.nodeType===1?a:a.parentElement).closest('[style*="color"]');return el&&node.contains(el)&&el!==node?el:null};
function placeTb(){
  const el=selEl();const k=[...sel][0];
  if(present()||sel.size!==1||!$('sheet').hidden){tb.hidden=true;return}
  const s=slide(),src=el||(typeof k==='string'&&deck.master.find(m=>m.id===k.slice(2)));
  if(!src||!(res(src,s).text||res(src,s).html)){tb.hidden=true;return}
  const node=canvas.querySelector(el?`[data-n="${k}"]`:`[data-m="${k.slice(2)}"]`);if(!node)return;
  const editing=node.isContentEditable,sr=getSelection();
  let rect=node.getBoundingClientRect();
  if(editing&&sr.rangeCount&&!sr.isCollapsed&&node.contains(sr.anchorNode)){const rr=sr.getRangeAt(0).getBoundingClientRect();if(rr.width)rect=rr}
  tb.hidden=false;
  const roles=Object.keys(deck.styles&&deck.styles.roles||{}),rw=$('tb-roles');
  rw.innerHTML=roles.map(n=>`<button data-role="${n}" class="${n===(src.role||(src.slot&&LAY(s)[src.slot]||{}).role)?'on':''}" title="${n}">${n}</button>`).join('');
  tb.querySelectorAll('[data-cmd]').forEach(b=>{b.disabled=!editing;b.classList.toggle('on',editing&&document.queryCommandState(b.dataset.cmd))});
  const run=editing&&!sr.isCollapsed&&runSpan(sr,node),cur=run?(run.getAttribute('style').match(/color:\s*([^;]+)/)||[])[1]:res(src,s).color;
  $('tb-colors').innerHTML=deckColors().map(c=>`<button class="sw${c===(cur||'').trim()?' on':''}" data-color="${c}" style="background:${c}" title="${c}" aria-label="${c}"></button>`).join('');
  $('tb-layout').hidden=!(el&&el.slot&&['x','y','w','h'].some(p=>el[p]!=null));
  $('tb-master').hidden=!(el&&el.override);
  tb.style.left=Math.max(4,Math.min(rect.left,innerWidth-tb.offsetWidth-4))+'px';tb.style.top=Math.max(4,rect.top-tb.offsetHeight-8)+'px';
}
tb.addEventListener('mousedown',e=>e.preventDefault()); // keep the text selection + focus alive
tb.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cmd){document.execCommand(b.dataset.cmd);placeTb();return}
  let k=[...sel][0];
  const sr=getSelection(),t0=canvas.querySelector('.el[contenteditable="true"]');
  if(b.dataset.color&&t0&&!sr.isCollapsed&&t0.contains(sr.anchorNode)){ // highlighted run → <span style="color:…"> in the html prop (same storage as B/I/U/S)
    const r=sr.getRangeAt(0),old=runSpan(sr,t0),sp=document.createElement('span');sp.setAttribute('style','color:'+b.dataset.color);
    if(old&&old.textContent===r.toString()){old.setAttribute('style','color:'+b.dataset.color)}else{sp.appendChild(r.extractContents());r.insertNode(sp);sr.removeAllRanges();sr.selectAllChildren(sp)}
    placeTb();return;
  }
  if(b.dataset.color){ // collapsed / not editing → whole-field color override on the row
    if(t0)commitEdit();
    snap();if(typeof k!=='number'){k=fork(k.slice(2));sel.clear();sel.add(k)}
    slide().els[k].color=b.dataset.color;save();render();return;
  }
  if(b.dataset.role){ // role applies to the WHOLE field: raw overrides are cleared so the treatment takes effect
    const t=canvas.querySelector('.el[contenteditable="true"]');if(t)commitEdit();
    snap();if(typeof k!=='number'){k=fork(k.slice(2));sel.clear();sel.add(k)}
    const el=slide().els[k];el.role=b.dataset.role;['font','size','weight','lh','ls','color','tt','mono'].forEach(p=>delete el[p]);save();render();return;
  }
  const el=slide().els[k];
  if(b.id==='tb-layout'){snap();const sl=LAY(slide())[el.slot];['x','y','w','h'].forEach(p=>{if(el[p]!=null){sl[p]=el[p];delete el[p]}});save();render()}
  if(b.id==='tb-master'){snap();const id=el.override,mi=deck.master.findIndex(m=>m.id===id);const m={...el,id};delete m.override;deck.master[mi]=m;slide().els.splice(k,1);sel.clear();save();render()}
});
document.addEventListener('selectionchange',()=>{if(!tb.hidden||canvas.querySelector('[contenteditable="true"]'))placeTb()});
// ── contact sheet: the slide manager ──
const sheet=$('sheet'),grid=$('grid');let gsel=new Set(),ganchor=0,clip=null,ins=null;
function sheetOpen(){commitEdit();sel.clear();gsel=new Set([i]);ganchor=i;sheet.hidden=false;sheetRender();tb.hidden=true}
function sheetClose(){sheet.hidden=true;render()}
function sheetRender(){
  grid.innerHTML='';
  deck.slides.forEach((s,n)=>{
    const c=document.createElement('div');c.className='cell'+(gsel.has(n)?' sel':'');c.draggable=true;c.dataset.n=n;
    const cv=document.createElement('div');cv.className='cv';drawEls(s,cv,false);num(cv,n+1);
    const lb=document.createElement('span');lb.className='n';lb.textContent=n+1;
    c.append(cv,lb);grid.appendChild(c);
    cv.style.transform=`scale(${(c.clientWidth/W).toFixed(4)})`;
  });
}
grid.addEventListener('mousedown',e=>{
  const c=e.target.closest('.cell');if(!c)return;const n=+c.dataset.n;
  if(e.metaKey||e.ctrlKey){gsel.has(n)?gsel.delete(n):gsel.add(n)}
  else if(e.shiftKey){const [a,b]=[Math.min(ganchor,n),Math.max(ganchor,n)];for(let x=a;x<=b;x++)gsel.add(x)}
  else{if(e.detail>=2){i=n;sheetClose();return}gsel=new Set([n]);ganchor=n}
  sheetRender();
});
grid.addEventListener('dragstart',e=>{const c=e.target.closest('.cell');if(!c)return;const n=+c.dataset.n;if(!gsel.has(n)){gsel=new Set([n]);ganchor=n}e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(n))});
grid.addEventListener('dragover',e=>{const c=e.target.closest('.cell');if(!c)return;e.preventDefault();const r=c.getBoundingClientRect(),before=e.clientX<r.left+r.width/2;
  ins=+c.dataset.n+(before?0:1);grid.querySelectorAll('.cell').forEach(x=>x.classList.remove('ins-before','ins-after'));c.classList.add(before?'ins-before':'ins-after')});
grid.addEventListener('dragleave',e=>{if(!grid.contains(e.relatedTarget)){ins=null;grid.querySelectorAll('.cell').forEach(x=>x.classList.remove('ins-before','ins-after'))}});
grid.addEventListener('drop',e=>{e.preventDefault();if(ins==null)return;reorder(ins);ins=null});
// reorder: ONE snapshot per drop; moved slides keep their relative order and land at the insertion index
function reorder(at){
  const mv=[...gsel].sort((a,b)=>a-b);if(!mv.length)return;snap();
  const items=mv.map(n=>deck.slides[n]);const rest=deck.slides.filter((_,n)=>!gsel.has(n));
  const at2=at-mv.filter(n=>n<at).length;rest.splice(at2,0,...items);deck.slides=rest;
  gsel=new Set(items.map((_,x)=>at2+x));i=at2;save();sheetRender();
}
const dup=s=>JSON.parse(JSON.stringify(s));
function sheetKey(e){
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(e.key==='Escape'){sheetClose();return true}
  if(e.key==='Enter'&&gsel.size){i=[...gsel][0];sheetClose();return true}
  if((e.key==='Backspace'||e.key==='Delete')&&gsel.size){ // never the last slide
    const del=[...gsel].sort((a,b)=>b-a);if(del.length>=deck.slides.length)del.pop();if(!del.length)return true;
    snap();del.forEach(n=>deck.slides.splice(n,1));i=Math.min(del[del.length-1],deck.slides.length-1);gsel=new Set([i]);ganchor=i;save();sheetRender();return true}
  if(mod&&k==='c'&&gsel.size){clip=[...gsel].sort((a,b)=>a-b).map(n=>dup(deck.slides[n]));return true}
  if(mod&&k==='v'&&clip){snap();const at=Math.max(...gsel,-1)+1;deck.slides.splice(at,0,...clip.map(dup));gsel=new Set(clip.map((_,x)=>at+x));i=at;save();sheetRender();return true}
  if(mod&&k==='d'&&gsel.size){snap();const src=[...gsel].sort((a,b)=>a-b),at=src[src.length-1]+1;deck.slides.splice(at,0,...src.map(n=>dup(deck.slides[n])));gsel=new Set(src.map((_,x)=>at+x));i=at;save();sheetRender();return true}
  if(mod&&k==='z'){undo();gsel=new Set([Math.min(i,deck.slides.length-1)]);sheetRender();return true}
  return false;
}
addEventListener('keydown',e=>{
  if(e.target.isContentEditable){if(e.key==='Escape')e.target.blur();return}
  if(!sheet.hidden){if(sheetKey(e))e.preventDefault();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='Escape'){if(sel.size){sel.clear();render()}else if(!present())sheetOpen();return}
  if(e.key==='ArrowRight'||e.key===' ')nav(1);
  if(e.key==='ArrowLeft')nav(-1);
  if((e.key==='Backspace'||e.key==='Delete')&&sel.size){
    snap();[...sel].filter(k=>typeof k!=='number').forEach(k=>(slide().hide=slide().hide||[]).push(k.slice(2)));
    [...sel].filter(k=>typeof k==='number').sort((a,b)=>b-a).forEach(n=>slide().els.splice(n,1));sel.clear();save();render();
  }
  if(e.key.toLowerCase()==='f')fs();
  if(e.key.toLowerCase()==='g')sheetOpen();
});
// native Fullscreen API — F or button toggles; fullscreen IS presentation mode (chrome hidden, slide fills the screen)
const fs=()=>{commitEdit();return document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('present',!!document.fullscreenElement);document.body.classList.remove('peek');sel.clear();sheet.hidden=true;render();fit()});
// present mode: HUD reappears while the pointer hovers the bottom twelfth of the screen, hides on leaving
addEventListener('mousemove',e=>{if(present())document.body.classList.toggle('peek',e.clientY>innerHeight*11/12)});
$('fs').onclick=fs;
$('pdf').onclick=()=>print();
$('grid-btn').onclick=()=>sheet.hidden?sheetOpen():sheetClose();
// "+" micro-menu: one HUD button fans out Text / Box / Slide; any pick or a click anywhere outside closes it
const addmenu=$('addmenu'),addbtn=$('addbtn');
const menu=open=>{addmenu.classList.toggle('open',open);addbtn.setAttribute('aria-expanded',open)};
addbtn.onclick=()=>menu(!addmenu.classList.contains('open'));
document.addEventListener('mousedown',e=>{if(!e.target.closest('#addwrap'))menu(false)});
// add text + box: new text is born Body — or binds to a free slot of the slide's layout (inheriting its role + geometry)
const TPL={
  text:{x:Math.round(W*.4),y:Math.round(H*.46),w:Math.round(W*.31),role:'Body',text:'New text — double-click to edit'},
  box:{x:Math.round(W*.42),y:Math.round(H*.43),w:Math.round(W*.19),size:15,box:1,text:'box'}
};
for(const k in TPL)$('add-'+k).onclick=()=>{
  commitEdit();menu(false);snap();const s=slide(),el=structuredClone(TPL[k]);
  if(k==='text'){const free=Object.keys(LAY(s)).find(n=>!s.els.some(e=>e.slot===n));if(free){['x','y','w','role'].forEach(p=>delete el[p]);el.slot=free}}
  s.els.push(el);sel.clear();sel.add(s.els.length-1);save();render();
};
// navigation (‹ prev / next › + arrow keys)
const nav=d=>{commitEdit();sel.clear();i+=d;render()};
$('prev').onclick=()=>nav(-1);
$('next').onclick=()=>nav(1);
// + Slide: same layout as the current slide, title slot filled; deleting/reordering lives in the contact sheet
$('sadd').onclick=()=>{commitEdit();menu(false);snap();const s=slide(),ns={els:[]};if(s.bg)ns.bg=s.bg;if(s.layout){ns.layout=s.layout;const t=Object.entries(LAY(s)).find(([,v])=>v.role==='H1');ns.els.push(t?{slot:t[0],text:'New slide'}:{x:60,y:88,w:W-120,role:'H1',text:'New slide'})}else ns.els.push({x:60,y:88,w:W-120,role:'H1',text:'New slide'});deck.slides.splice(i+1,0,ns);i++;sel.clear();save();render()};
fit();render();

// self-check — model round-trips through JSON and renderer draws every element (+ master rows)
console.assert(JSON.parse(JSON.stringify(DECK)).slides.length===DECK.slides.length,'model round-trip');
console.assert(canvas.querySelectorAll('.el').length===DECK.slides[0].els.length+(DECK.master||[]).length,'renderer draws all elements');
</script>
