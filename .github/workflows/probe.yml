name: probe
on:
  push:
    branches: ['claude/firefox-store-flake-*']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -D playwright && npx playwright install --with-deps chromium webkit firefox
        timeout-minutes: 15
      - name: probe under suite load
        run: |
          for i in 1 2 3; do node .ci-probe/probe.mjs . 60 p$i > p$i.log 2>&1 & done
          node --test --test-reporter=tap test/**/*.test.mjs > suite.log 2>&1 || true
          wait
          grep -hE '^(FLAG|ERR|DONE)' p*.log
          grep -E '^not ok|^# (pass|fail) ' suite.log | cut -c1-140
      - name: probe alone
        run: node .ci-probe/probe.mjs . 60 solo | grep -E '^(FLAG|ERR|DONE)'
