name: archify
# Pushes branch archify/<tag> when tt-a1i/archify cuts a release newer than vendor/archify.lock.json, then stops: GitHub Actions
# may not open pull requests in this repository, so the run leaves a notice and a person opens the PR. docs/archify.md.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: check
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          if node bin/archify-sync.mjs --check; then echo "tag=" >> "$GITHUB_OUTPUT"
          else echo "tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/tt-a1i/archify/releases/latest | jq -r .tag_name)" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.tag != ''
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          TAG: '${{ steps.check.outputs.tag }}'
        run: |
          PR="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...archify/$TAG?expand=1"
          git ls-remote --exit-code origin "refs/heads/archify/$TAG" && { echo "::notice title=archify $TAG::Branch archify/$TAG is pushed and not merged yet. Open the PR by hand: $PR"; exit 0; }
          node bin/archify-sync.mjs --tag "$TAG"
          node --test test/archify.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "archify/$TAG"
          git add vendor CHANGELOG.md docs/archify.md
          git commit -m "archify: vendor $TAG"
          git push origin "archify/$TAG"
          echo "::notice title=archify $TAG::Pushed branch archify/$TAG; the archify gate passed in this run. Open the PR by hand: $PR"
