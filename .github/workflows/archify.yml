name: archify
# Opens a PR when tt-a1i/archify cuts a release newer than vendor/archify.lock.json. docs/archify.md.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: check
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          if node bin/archify-sync.mjs --check; then echo "tag=" >> "$GITHUB_OUTPUT"
          else echo "tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/tt-a1i/archify/releases/latest | jq -r .tag_name)" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.tag != ''
        env:
          GH_TOKEN: '${{ github.token }}'
          GITHUB_TOKEN: '${{ github.token }}'
          TAG: '${{ steps.check.outputs.tag }}'
        run: |
          git ls-remote --exit-code origin "refs/heads/archify/$TAG" && { echo "archify/$TAG already open"; exit 0; }
          node bin/archify-sync.mjs --tag "$TAG"
          node --test test/archify.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "archify/$TAG"
          git add vendor CHANGELOG.md docs/archify.md
          git commit -m "archify: vendor $TAG"
          git push origin "archify/$TAG"
          gh pr create --title "archify: vendor $TAG" --body "Moves vendor/archify to $TAG with bin/archify-sync.mjs. Release notes: https://github.com/tt-a1i/archify/releases/tag/$TAG. The archify gate passed in this run; close and reopen the PR to start the full test workflow."
