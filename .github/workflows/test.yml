name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # real browsers: layout parity, occlusion and the editor proofs run here, not only on a laptop before push. The save suites
      # run once per project of test/helpers/projects.mjs: chromium, webkit (the Safari storage case), firefox, and an embedded
      # chromium pane with no File System Access, beforeunload ignored and downloads refused
      - run: npm i -D playwright && npx playwright install --with-deps chromium webkit firefox
        timeout-minutes: 10
      - run: node --test test/**/*.test.mjs
