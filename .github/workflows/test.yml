name: test
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # real browsers: layout parity, occlusion and the editor proofs run here, not only on a laptop before push; webkit for the Safari storage case
      - run: npm i -D playwright && npx playwright install --with-deps chromium webkit
      - run: node --test test/**/*.test.mjs
